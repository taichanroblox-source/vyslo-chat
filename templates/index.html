<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171923">
  <title>VYSLO CHAT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <main class="page">
    <section class="panel" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">V</div>
      <p class="eyebrow">YOUR SPACE TO CHAT</p>
      <h1 id="page-title">VYSLO <span>CHAT</span></h1>
      <p class="intro">はじめにユーザー設定をしよう。</p>

      <form id="setup-form">
        <label for="username">ユーザー名</label>
        <input id="username" name="username" type="text"
               maxlength="24" autocomplete="nickname"
               placeholder="例：Codelian" required>
        <p class="hint">このブラウザに保存して、次回も使えるようにするよ。</p>

        <div class="admin-option">
          <label class="checkbox-label" for="admin-mode">
            <input id="admin-mode" name="admin-mode" type="checkbox">
            <span>サービス全体の管理者としてログイン</span>
          </label>
        </div>

        <div id="admin-password-area" hidden>
          <label for="admin-password">管理者パスワード</label>
          <input id="admin-password" name="admin-password"
                 type="password" autocomplete="current-password"
                 placeholder="管理者用パスワード">
          <p class="hint warning">
            これは画面の試作だよ。管理者認証はまだ接続されていないため、
            パスワードを入力しても送信・保存されないよ。
          </p>
        </div>

        <button type="submit" class="primary-button">設定を保存して進む</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <div class="next-step">
        <span class="step-dot"></span>
        次のステップ：部屋の作成・参加
      </div>
    </section>
    <footer>VYSLO CHAT <span>•</span> 初期試作版</footer>
  </main>
</body>
</html>
